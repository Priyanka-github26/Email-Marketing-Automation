```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Email Marketing Automation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #101c3a, #253b68);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: white;
            border: none;
            border-radius: 18px;
            padding: 38px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .brand {
            color: #2563eb;
            font-weight: 700;
            font-size: 18px;
            text-align: center;
            margin-bottom: 22px;
        }

        .login-title {
            color: #172554;
            font-weight: 700;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .btn-login {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 9px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #1d4ed8;
            color: white;
        }

        .register-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">✉ EmailFlow</div>

    <h2 class="text-center login-title mb-2">Welcome Back!</h2>
    <p class="text-center text-muted mb-4">
        Login to manage your email campaigns
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" name="email"
                   class="form-control"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>
        </div>

        <button type="submit" class="btn btn-login w-100">
            Login
        </button>

    </form>

    <p class="text-center mt-4 mb-0 text-muted">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}" class="register-link">
            Register
        </a>
    </p>

</div>

</body>
</html>
```
