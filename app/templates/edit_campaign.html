
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Campaign | Email Marketing Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="{{ url_for('main.dashboard') }}">
        Email Marketing Automation
    </a>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Campaign</h4>
        </div>

        <div class="card-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Campaign Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ campaign.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Subject</label>
                    <input type="text" name="subject" class="form-control"
                           value="{{ campaign.subject }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Template</label>
                    <select name="template_id" class="form-select">
                        <option value="">No template selected</option>
                        {% for template in templates %}
                        <option value="{{ template.id }}"
                            {% if campaign.template_id == template.id %}selected{% endif %}>
                            {{ template.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Campaign
                </button>

                <a href="{{ url_for('main.campaigns') }}"
                   class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
