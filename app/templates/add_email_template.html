
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create Email Template | Email Marketing Automation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm mx-auto" style="max-width: 750px;">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Create New Email Template</h4>
        </div>

        <div class="card-body">

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST">

                <!-- Template Name -->
                <div class="mb-3">
                    <label class="form-label">Template Name</label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Example: Welcome Email"
                           maxlength="150"
                           required>
                </div>

                <!-- Email Subject -->
                <div class="mb-3">
                    <label class="form-label">Email Subject</label>

                    <input type="text"
                           name="subject"
                           class="form-control"
                           placeholder="Enter email subject"
                           maxlength="255"
                           required>
                </div>

                <!-- Email Body -->
                <div class="mb-3">
                    <label class="form-label">Email Body</label>

                    <textarea name="body"
                              class="form-control"
                              rows="10"
                              placeholder="Write your email content here..."
                              required></textarea>
                </div>

                <!-- Buttons -->
                <button type="submit" class="btn btn-primary">
                    Save Template
                </button>

                <a href="{{ url_for('main.email_templates') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
